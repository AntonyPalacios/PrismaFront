name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels that PR's previous run. Runs on main are keyed by
# commit, so they never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Docs-only PRs skip the build steps, but the job itself still runs and
      # reports green, so the required check never stays pending.
      - name: Detect code changes
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'

      - name: Set up Node 22
        if: github.event_name == 'push' || steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event_name == 'push' || steps.changes.outputs.code == 'true'
        run: npm ci

      - name: Lint
        if: github.event_name == 'push' || steps.changes.outputs.code == 'true'
        run: npm run lint

      - name: Test
        if: github.event_name == 'push' || steps.changes.outputs.code == 'true'
        run: npm test

      - name: Build
        if: github.event_name == 'push' || steps.changes.outputs.code == 'true'
        run: npm run build

      - name: Skip notice
        if: github.event_name == 'pull_request' && steps.changes.outputs.code != 'true'
        run: echo "Docs-only change, build and tests skipped."
